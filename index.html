<!DOCTYPE html>

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
    {
        "imports": {
			"three": "./node_modules/three/build/three.module.js",
            "addons": "./node_modules/three/examples/jsm/Addons.js"
        }
    }
</script>


<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brush Cove</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <header>
            <div class="site-title"><a href="#">Brush Cove</a></div>
            <div class="topbar">
                <div class="profile-options">
                    <button id="profile-some-option" class="action-button">Rand</button>
                    <button id="profile-login" class="action-button">Profile</button>

                </div>
            </div>

        </header>
        <main class="content">
            <!-- The container holding the model to be edited -->
            <div id="model-grounds">
                <div class="model-grounds-xyz-cube"></div>
                <div class="model-render">
                    <script type="module" src="index.js"></script>
                </div>

            </div>

            <!-- The container holding the options to edit the model -->
            <div id="model-options">
                <div class="model-options-list">
                    <button id="option-sculpt-button" class="action-button" style="font-size:48px"> 
                        &#128511;                   <!-- emoji placeholde 🗿 -->
                    </button>
                    <button id="option-paint-button" class="action-button" style="font-size:48px"> 
                        &#127912;                   <!-- emoji placeholde 🎨 -->
                    </button>
                    <button id="option-brush-button" class="action-button" style="font-size:48px"> 
                        &#9999;                   <!-- emoji placeholde ✏ -->
                    </button>
                    <button id="option-settings-button" class="action-button" style="font-size:48px"> 
                        &#128295;                   <!-- emoji placeholde 🔧 -->
                    </button>

                </div>
                <div class="model-selected-container">
                    <div class="model-option-tag">
                        <div id="option-sculpt">
                            
                        </div>
                    </div>

                    <div class="model-option-tag">
                        <div id="option-paint">

                        </div>
                    </div>

                    <div class="model-option-tag">
                        <div id="option-brush">

                        </div>
                    </div>

                    <div class="model-option-tag">
                        <div id="option-settings">

                        </div>
                    </div>

                </div>

            </div>
        </main>
    </body>
</html>
